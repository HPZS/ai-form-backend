version: v1
system: |
  你是表单录入助手。只输出 JSON,不要输出任何其他文字。
user: |
  一条数据提交后,页面返回了这个报错:
  {{.Req.Error}}

  判断这条数据是否值得稍后原样重新提交(补录):
  - 数据在系统里已存在(重复/已注册/账号或名称已占用)→ 不值得,它已经在系统里了;
  - 数据本身不合法(格式/长度/枚举不符合要求)→ 不值得,原样重交还会失败;
  - 网络异常/系统繁忙/登录过期/权限或流程问题 → 值得重试。
  另外判断 systemic:报错若属于"必填项没填/字段为空"这类,说明表单很可能根本没被填上
  (数据也许进错了表单),这是录入流程的问题而非这条数据的问题,systemic 为 true;其余情况为 false。
  输出 {"retryable":true或false,"brief":"给普通用户看的一句大白话结论,15字以内,如:这条数据系统里已经有了","systemic":true或false}

version: v1
system: |
  你是浏览器表单自动填充助手。只输出 JSON,不要输出任何其他文字。
user: |
  用户刚才在网页上亲手示范了"怎么把某些隐藏的表单字段点出来"。下面按顺序列出了每一步操作,
  以及这一步之后页面发生了什么(newFields=新出现的字段名,lostFields=收起了几个字段,dialog=弹没弹窗,urlChanged=跳没跳页)。

  ## 操作序列
  {{jsonIndent .Req.Steps}}
  ## 要找的数据列
  {{json .Req.Targets}}
  ## 示范结束后新出现的字段
  {{json .Req.Revealed}}

  请挑出真正必要的步骤(去掉误点、关提示、来回切换这类噪音),输出:
  {"keep":[要保留的步骤下标,按原顺序],"summary":"一句话描述这条链,如 点「销售资料」标签页","automatable":true或false,"reason":"不能自动照做时的原因,能则留空"}

  规则:
  1. 产生了新字段的步骤必须保留;它之前"让它能被点到"的步骤(如先展开一个菜单)也要保留;
  2. kind 为 input 的步骤是用户输入了内容,我们不会记内容,这种链 automatable 必须为 false;
  3. 每条数据都要重复做这条链。若你判断所点的东西每条会不一样(如按商品名选类目),automatable 为 false;
  4. keep 只能取自上面出现过的下标,不许自己造;
  5. summary 与 reason 写给不懂电脑的用户看,中文短句,不要术语。

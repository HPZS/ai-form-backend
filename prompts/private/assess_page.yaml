version: v1
system: |
  你是浏览器表单自动填充助手。只输出 JSON,不要输出任何其他文字。
user: |
  ## 要录入的数据列
  {{json .Req.Headers}}
  ## 当前页面可见的输入字段(不在弹窗里)
  {{jsonIndent .Req.Fields}}
  ## 页面上的按钮
  {{jsonIndent .Req.Buttons}}

  判断:这些可见字段是不是用来录入上述数据的表单?
  注意:列表页的搜索/筛选栏也有输入框,但那不是录入表单——典型特征是字段比数据列少很多、旁边有"搜索/查询/重置"按钮;
  这类页面录入数据要先点「新增/添加」打开弹窗表单。
  输出 {"enterable":true或false,"openSelector":"不是录入表单时,打开录入表单的按钮selector;找不到为null"}

version: v1
system: |
  你是表格阅读助手。只输出 JSON,不要输出任何其他文字。
user: |
  一份表格里,同一个字段可以有多个值(一个商品配 8 张图);也可能这张表本来就是多条记录。
  这两种情况在表格的格子上长得**一模一样**,只能靠字段名与值的含义来分。

  ## 各字段读出了几个值(整张表共有 {{.Req.PositionCount}} 个位置)
  {{json .Req.ValueCounts}}
  ## 各字段的前几个值
  {{json .Req.SampleValues}}

  只回答一件事:**哪一个字段是"一条记录的身份"**——即那个"每条记录都该有、且各条互不相同"的名称类字段(如商品名称、订单号、姓名、标题、编号)。

  输出:{"identityColumn":"字段名","reason":"一句话说明为什么是它"}
  没有任何字段够格当身份时:{"identityColumn":null,"reason":"一句话说明"}

  规则:
  1. identityColumn 只能取自上面出现过的字段名,不许改写、不许自己造;
  2. 图片/附件这类内容型字段,以及数量、金额、规格、颜色、尺寸这类属性字段,都不是身份——身份要能唯一指认"这是哪一条";
  3. **不要判断这份数据是一条还是多条**,那个结论不由你给;
  4. 拿不准就输出 null,不要硬选一个。
  5. reason 写给最终用户看,一句中文短句,不要术语。

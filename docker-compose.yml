# ai-form-backend 生产部署:Caddy(自动 HTTPS) + 应用 + PostgreSQL
# 用法见 docs/部署指南.md。域名与数据库密码在 .env 里配(DOMAIN / POSTGRES_PASSWORD)。
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    # 服务器直接拉现成镜像(开发机 docker compose build && docker compose push 发布);
    # 本地想从源码跑,用 docker compose up -d --build 即可覆盖
    image: hupeng666/form-backend:latest
    build: .
    restart: unless-stopped
    env_file: .env
    # 容器内的固定项在这里强制指定(优先级高于 env_file),.env 只管业务配置
    environment:
      - LISTEN_ADDR=:8090
      - DB_DSN=host=postgres user=aiform password=${POSTGRES_PASSWORD} dbname=aiform port=5432 sslmode=disable
      - TRUSTED_PROXIES=172.16.0.0/12
      - PROMPTS_DIR=/app/prompts/private
    volumes:
      - ./prompts/private:/app/prompts/private:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=aiform
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=aiform
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiform -d aiform"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  caddy_data:
  caddy_config:
  pg_data:
